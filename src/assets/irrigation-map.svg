<svg viewBox="0 0 900 706" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Estate Irrigation Zone Map">
  <defs>
    <!-- Clock 1 gradients (greens — entry/front) -->
    <linearGradient id="g-c1a" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22c55e" stop-opacity="0.88"/><stop offset="100%" stop-color="#15803d" stop-opacity="0.88"/></linearGradient>
    <linearGradient id="g-c1b" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#16a34a" stop-opacity="0.88"/><stop offset="100%" stop-color="#14532d" stop-opacity="0.88"/></linearGradient>
    <linearGradient id="g-c1c" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4ade80" stop-opacity="0.88"/><stop offset="100%" stop-color="#166534" stop-opacity="0.88"/></linearGradient>
    <linearGradient id="g-c1d" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#86efac" stop-opacity="0.88"/><stop offset="100%" stop-color="#15803d" stop-opacity="0.88"/></linearGradient>
    <linearGradient id="g-c1e" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#15803d" stop-opacity="0.88"/><stop offset="100%" stop-color="#052e16" stop-opacity="0.88"/></linearGradient>
    <linearGradient id="g-c1f" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#166534" stop-opacity="0.88"/><stop offset="100%" stop-color="#052e16" stop-opacity="0.88"/></linearGradient>
    <!-- Clock 2 gradients (teals — west perimeter) -->
    <linearGradient id="g-c2a" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity="0.88"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0.88"/></linearGradient>
    <linearGradient id="g-c2b" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.88"/><stop offset="100%" stop-color="#0891b2" stop-opacity="0.88"/></linearGradient>
    <linearGradient id="g-c2c" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#67e8f9" stop-opacity="0.88"/><stop offset="100%" stop-color="#0e7490" stop-opacity="0.88"/></linearGradient>
    <linearGradient id="g-c2d" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#155e75" stop-opacity="0.88"/><stop offset="100%" stop-color="#082f49" stop-opacity="0.88"/></linearGradient>
    <linearGradient id="g-c2e" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0.88"/><stop offset="100%" stop-color="#0284c7" stop-opacity="0.88"/></linearGradient>
    <!-- Clock 3 gradients (amber/violet — pool surrounds & NE) -->
    <linearGradient id="g-c3a" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f59e0b" stop-opacity="0.88"/><stop offset="100%" stop-color="#b45309" stop-opacity="0.88"/></linearGradient>
    <linearGradient id="g-c3b" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fbbf24" stop-opacity="0.88"/><stop offset="100%" stop-color="#d97706" stop-opacity="0.88"/></linearGradient>
    <linearGradient id="g-c3c" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#d97706" stop-opacity="0.88"/><stop offset="100%" stop-color="#92400e" stop-opacity="0.88"/></linearGradient>
    <linearGradient id="g-c3d" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#a78bfa" stop-opacity="0.88"/><stop offset="100%" stop-color="#6d28d9" stop-opacity="0.88"/></linearGradient>
    <linearGradient id="g-c3e" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.88"/><stop offset="100%" stop-color="#5b21b6" stop-opacity="0.88"/></linearGradient>
    <linearGradient id="g-c3f" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7c3aed" stop-opacity="0.88"/><stop offset="100%" stop-color="#4c1d95" stop-opacity="0.88"/></linearGradient>
    <linearGradient id="g-pool" x1="0%" y1="0%" x2="40%" y2="100%"><stop offset="0%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#1e3a8a"/></linearGradient>
    <linearGradient id="g-ground" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f1f0e"/><stop offset="100%" stop-color="#0a1608"/></linearGradient>
    <filter id="f-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="0" dy="2" result="offset"/>
      <feFlood flood-color="#000" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-glow-blue">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════════════
       BACKGROUND
  ══════════════════════════════════════════════ -->
  <rect x="0" y="0" width="900" height="706" fill="#080f08"/>
  <rect x="35" y="21" width="830" height="664" rx="5" fill="url(#g-ground)" stroke="#1a3318" stroke-width="1.5"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="0.5">
    <line x1="35" y1="21" x2="35" y2="685"/><line x1="100" y1="21" x2="100" y2="685"/>
    <line x1="200" y1="21" x2="200" y2="685"/><line x1="330" y1="21" x2="330" y2="685"/>
    <line x1="450" y1="21" x2="450" y2="685"/><line x1="590" y1="21" x2="590" y2="685"/>
    <line x1="640" y1="21" x2="640" y2="685"/><line x1="730" y1="21" x2="730" y2="685"/>
    <line x1="865" y1="21" x2="865" y2="685"/>
    <line x1="35" y1="21" x2="865" y2="21"/><line x1="35" y1="65" x2="865" y2="65"/>
    <line x1="35" y1="155" x2="865" y2="155"/><line x1="35" y1="205" x2="865" y2="205"/>
    <line x1="35" y1="360" x2="865" y2="360"/><line x1="35" y1="440" x2="865" y2="440"/>
    <line x1="35" y1="530" x2="865" y2="530"/><line x1="35" y1="685" x2="865" y2="685"/>
  </g>

  <!-- ══════════════════════════════════════════════
       CLOCK 1 ZONES — Front / Entry (greens)
  ══════════════════════════════════════════════ -->
  <polygon id="clock-1-valve-1" points="35,530 330,530 330,685 35,685" fill="url(#g-c1a)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-1-valve-2" points="590,530 865,530 865,685 590,685" fill="url(#g-c1b)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-1-valve-3" points="330,535 415,535 415,685 330,685" fill="url(#g-c1c)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-1-valve-4" points="485,535 590,535 590,685 485,685" fill="url(#g-c1d)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-1-valve-5" points="415,535 455,533 455,685 415,685" fill="url(#g-c1e)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-1-valve-6" points="455,533 485,535 485,685 455,685" fill="url(#g-c1f)" stroke="#000" stroke-width="0.5" opacity="0.85"/>

  <!-- ══════════════════════════════════════════════
       CLOCK 2 ZONES — West Perimeter (teals)
  ══════════════════════════════════════════════ -->
  <polygon id="clock-2-valve-1" points="35,21 200,21 200,155 35,155" fill="url(#g-c2a)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-2-valve-2" points="200,21 310,21 310,155 200,155" fill="url(#g-c2b)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-2-valve-3" points="35,155 310,155 310,360 35,360" fill="url(#g-c2c)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-2-valve-4" points="35,360 330,360 330,440 35,440" fill="url(#g-c2a)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-2-valve-5" points="35,440 330,440 330,530 35,530" fill="url(#g-c2d)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-2-valve-6" points="590,155 640,155 640,360 590,360" fill="url(#g-c2d)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-2-valve-7" points="590,360 640,360 640,455 590,455" fill="url(#g-c2d)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-2-valve-8" points="310,21 590,21 590,155 310,155" fill="url(#g-c2b)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-2-valve-9" points="840,205 865,205 865,455 840,455" fill="url(#g-c2e)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-2-valve-10" points="560,365 590,365 590,535 560,535" fill="url(#g-c2a)" stroke="#000" stroke-width="0.5" opacity="0.85"/>

  <!-- ══════════════════════════════════════════════
       CLOCK 3 ZONES — Pool surrounds / NE (ambers & violets)
  ══════════════════════════════════════════════ -->
  <polygon id="clock-3-valve-1" points="590,21 865,21 865,65 590,65" fill="url(#g-c3a)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-3-valve-2" points="640,155 865,155 865,205 640,205" fill="url(#g-c3b)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-3-valve-3" points="640,205 668,205 668,435 640,435" fill="url(#g-c3c)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-3-valve-4" points="668,205 810,205 810,220 668,220" fill="url(#g-c3c)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-3-valve-5" points="810,205 832,205 832,435 810,435" fill="url(#g-c3d)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-3-valve-6" points="668,435 810,435 810,455 668,455" fill="url(#g-c3e)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-3-valve-7" points="640,455 740,455 740,530 640,530" fill="url(#g-c3f)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-3-valve-8" points="840,455 865,455 865,530 840,530" fill="url(#g-c3f)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-3-valve-9" points="590,65 865,65 865,110 590,110" fill="url(#g-c3a)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-3-valve-10" points="590,110 865,110 865,155 590,155" fill="url(#g-c3b)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-3-valve-11" points="740,455 840,455 840,530 740,530" fill="url(#g-c3e)" stroke="#000" stroke-width="0.5" opacity="0.85"/>

  <!-- ══════════════════════════════════════════════
       CLOCK 1 ZONES 7–12 — Rear garden / north lawn / service (greens)
       Drawn after Clocks 2 & 3 so they sit on top of clock-2-valve-8
       ("North Above House"), a placeholder zone that has no HA entity —
       the ESP-TM2 zones below are the live, metered coverage of this band.
  ══════════════════════════════════════════════ -->
  <polygon id="clock-1-valve-12" points="310,21 590,21 590,40 310,40" fill="url(#g-c1f)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-1-valve-8" points="310,40 450,40 450,98 310,98" fill="url(#g-c1d)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-1-valve-7" points="450,40 590,40 590,98 450,98" fill="url(#g-c1c)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-1-valve-10" points="310,98 450,98 450,155 310,155" fill="url(#g-c1a)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-1-valve-11" points="450,98 590,98 590,155 450,155" fill="url(#g-c1b)" stroke="#000" stroke-width="0.5" opacity="0.85"/>
  <polygon id="clock-1-valve-9" points="590,455 640,455 640,530 590,530" fill="url(#g-c1e)" stroke="#000" stroke-width="0.5" opacity="0.85"/>

  <!-- ══════════════════════════════════════════════
       STRUCTURES
  ══════════════════════════════════════════════ -->

  <!-- Pool deck surround -->
  <rect x="640" y="205" width="200" height="250" rx="5" fill="#1e2e1e" stroke="#2a4028" stroke-width="1.5"/>

  <!-- Pool coping ring -->
  <rect x="662" y="216" width="152" height="223" rx="55" fill="none" stroke="#3a5a38" stroke-width="2.5"/>

  <!-- Pool water -->
  <rect x="668" y="220" width="142" height="215" rx="52" fill="url(#g-pool)" filter="url(#f-glow-blue)" stroke="#2563eb" stroke-width="1.5"/>

  <!-- Pool shimmer highlights -->
  <ellipse cx="735" cy="248" rx="40" ry="12" fill="#60a5fa" opacity="0.12"/>
  <ellipse cx="720" cy="275" rx="18" ry="4" fill="#93c5fd" opacity="0.09"/>
  <ellipse cx="750" cy="295" rx="12" ry="3" fill="#bfdbfe" opacity="0.07"/>

  <!-- Pool label -->
  <text x="739" y="328" text-anchor="middle" font-size="10" font-family="'Inter',system-ui,sans-serif" fill="#93c5fd" font-weight="700" letter-spacing="2" opacity="0.8">POOL</text>

  <!-- Spa (small circle adjacent to pool) -->
  <circle cx="822" cy="390" r="15" fill="#1e3a6e" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="822" y="394" text-anchor="middle" font-size="6" font-family="'Inter',system-ui,sans-serif" fill="#93c5fd" font-weight="600" letter-spacing="0.5">SPA</text>

  <!-- Main house footprint with shadow -->
  <rect x="312" y="157" width="280" height="205" rx="3" fill="#1a1a1a" opacity="0.5"/>
  <rect x="310" y="155" width="280" height="205" rx="4" fill="#252525" stroke="#3a3a3a" stroke-width="1.5"/>

  <!-- House window grids (decorative detail) -->
  <rect x="322" y="167" width="256" height="181" rx="2" fill="#1c1c1c"/>
  <!-- Window rows -->
  <rect x="330" y="175" width="35" height="22" rx="2" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <rect x="375" y="175" width="35" height="22" rx="2" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <rect x="420" y="175" width="35" height="22" rx="2" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <rect x="500" y="175" width="35" height="22" rx="2" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <rect x="545" y="175" width="35" height="22" rx="2" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <rect x="330" y="215" width="240" height="28" rx="2" fill="#222" stroke="#333" stroke-width="0.5" opacity="0.6"/>
  <rect x="330" y="260" width="35" height="22" rx="2" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <rect x="375" y="260" width="35" height="22" rx="2" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <rect x="500" y="260" width="35" height="22" rx="2" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <rect x="545" y="260" width="35" height="22" rx="2" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <!-- House label -->
  <text x="450" y="254" text-anchor="middle" font-size="11" font-family="'Inter',system-ui,sans-serif" fill="#6b7280" font-weight="700" letter-spacing="2.5">RESIDENCE</text>

  <!-- Motor court (paved) -->
  <rect x="330" y="365" width="230" height="170" rx="4" fill="#1e1e1e" stroke="#2e2e2e" stroke-width="1.5"/>
  <!-- Paving detail lines -->
  <line x1="350" y1="375" x2="540" y2="375" stroke="#333" stroke-width="0.5" stroke-dasharray="8,6"/>
  <line x1="350" y1="395" x2="540" y2="395" stroke="#333" stroke-width="0.5" stroke-dasharray="8,6"/>
  <line x1="350" y1="415" x2="540" y2="415" stroke="#333" stroke-width="0.5" stroke-dasharray="8,6"/>
  <line x1="350" y1="435" x2="540" y2="435" stroke="#333" stroke-width="0.5" stroke-dasharray="8,6"/>
  <line x1="350" y1="455" x2="540" y2="455" stroke="#333" stroke-width="0.5" stroke-dasharray="8,6"/>
  <line x1="350" y1="475" x2="540" y2="475" stroke="#333" stroke-width="0.5" stroke-dasharray="8,6"/>
  <line x1="350" y1="495" x2="540" y2="495" stroke="#333" stroke-width="0.5" stroke-dasharray="8,6"/>
  <line x1="350" y1="515" x2="540" y2="515" stroke="#333" stroke-width="0.5" stroke-dasharray="8,6"/>
  <!-- Motor court label -->
  <text x="445" y="453" text-anchor="middle" font-size="9" font-family="'Inter',system-ui,sans-serif" fill="#525252" font-weight="600" letter-spacing="1.5">MOTOR COURT</text>

  <!-- Driveway -->
  <polygon points="330,535 560,535 485,640 415,640" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="1"/>
  <!-- Driveway lane markings -->
  <line x1="450" y1="540" x2="450" y2="630" stroke="#333" stroke-width="0.8" stroke-dasharray="10,8"/>

  <!-- Gate pillars (more detailed) -->
  <rect x="406" y="638" width="16" height="47" rx="2" fill="#2e2e2e" stroke="#4a4a4a" stroke-width="1.2"/>
  <rect x="478" y="638" width="16" height="47" rx="2" fill="#2e2e2e" stroke="#4a4a4a" stroke-width="1.2"/>
  <!-- Gate pillar caps -->
  <rect x="404" y="636" width="20" height="5" rx="1" fill="#3a3a3a" stroke="#555" stroke-width="0.8"/>
  <rect x="476" y="636" width="20" height="5" rx="1" fill="#3a3a3a" stroke="#555" stroke-width="0.8"/>
  <!-- Gate bar -->
  <line x1="422" y1="660" x2="478" y2="660" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="450" y="656" text-anchor="middle" font-size="7.5" font-family="'Inter',system-ui,sans-serif" fill="#555" font-weight="600" letter-spacing="0.8">ENTRY GATE</text>

  <!-- ══════════════════════════════════════════════
       PROPERTY BOUNDARY
  ══════════════════════════════════════════════ -->
  <rect x="35" y="21" width="830" height="664" rx="5" fill="none" stroke="#3d5c3a" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- ══════════════════════════════════════════════
       STREET LABEL — Main Access Way
  ══════════════════════════════════════════════ -->
  <g transform="translate(18,353) rotate(-90)">
    <text x="0" y="0" text-anchor="middle" font-size="8.5" font-family="'Inter',system-ui,sans-serif" fill="#4b7a47" font-weight="600" letter-spacing="2">MAIN ACCESS WAY</text>
  </g>

  <!-- ══════════════════════════════════════════════
       NORTH COMPASS
  ══════════════════════════════════════════════ -->
  <g transform="translate(72,50)">
    <circle cx="0" cy="0" r="16" fill="#0f1f0e" stroke="#3d5c3a" stroke-width="1.5"/>
    <!-- North pointer (filled) -->
    <polygon points="0,-11 4,3 0,0 -4,3" fill="#94a3b8"/>
    <!-- South pointer (hollow) -->
    <polygon points="0,11 4,-3 0,0 -4,-3" fill="#374151"/>
    <text x="0" y="-14" text-anchor="middle" font-size="7.5" font-family="'Inter',system-ui,sans-serif" fill="#94a3b8" font-weight="800">N</text>
  </g>

  <!-- ══════════════════════════════════════════════
       LEGEND (clock color key)
  ══════════════════════════════════════════════ -->
  <g transform="translate(310,670)">
    <rect x="0" y="0" width="280" height="26" rx="3" fill="#111e10" stroke="#1e3318" stroke-width="1"/>
    <!-- C1 swatch -->
    <rect x="8" y="8" width="10" height="10" rx="2" fill="#22c55e"/>
    <text x="22" y="17" font-size="8.5" font-family="'Inter',system-ui,sans-serif" fill="#9ca3af" font-weight="600">Main Garden</text>
    <!-- C2 swatch -->
    <rect x="102" y="8" width="10" height="10" rx="2" fill="#06b6d4"/>
    <text x="116" y="17" font-size="8.5" font-family="'Inter',system-ui,sans-serif" fill="#9ca3af" font-weight="600">Pool Equip 2</text>
    <!-- C3 swatch -->
    <rect x="196" y="8" width="10" height="10" rx="2" fill="#f59e0b"/>
    <text x="210" y="17" font-size="8.5" font-family="'Inter',system-ui,sans-serif" fill="#9ca3af" font-weight="600">Garage Timer</text>
  </g>

  <!-- Property label -->
  <text x="855" y="34" text-anchor="end" font-size="8" font-family="'Inter',system-ui,sans-serif" fill="#3d5c3a" font-weight="600" letter-spacing="1">ESTATE ZONE MAP</text>

</svg>
