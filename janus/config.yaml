name: "Janus"
version: "1.0.15"
slug: "janus"
description: "AI-orchestrated residential estate operating system and command deck."
url: "https://github.com/tonysafoian/janus-home-app"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 5080
panel_icon: "mdi:shield-home"
panel_title: "Janus"
homeassistant_api: true
hassio_api: true
hassio_role: "default"
host_network: false
options:
  log_level: "info"
  enable_demo_login: true
  enable_mock_mode: false
schema:
  log_level: "list(trace|debug|info|notice|warning|error|fatal)?"
  enable_demo_login: "bool?"
  enable_mock_mode: "bool?"
  gemini_api_key: "password?"
  google_client_id: "str?"
  google_client_secret: "password?"
  database_url: "str?"
