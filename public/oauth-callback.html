<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club 34 - Signing In</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .card { text-align: center; max-width: 400px; padding: 2rem; }
  .spinner { width: 48px; height: 48px; border: 4px solid #333; border-top-color: #d4a574; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { font-size: 1.2rem; margin: 0.5rem 0; }
  p { font-size: 0.9rem; color: #999; }
  .error { color: #ef4444; }
  a { color: #d4a574; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner" id="spinner"></div>
  <h2 id="title">Signing in...</h2>
  <p id="msg">Please wait while we complete authentication.</p>
</div>
<script>
(async function() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');
  // Same-origin so the auth_token cookie is set on example.com, not club34.replit.app.
  // Cross-origin set-cookie was being stored on the wrong domain → admin fetches
  // from example.com sent no cookie → 401. Empty string = relative URL = same origin
  // via the CF Pages _worker.js proxy → /api/auth/google/exchange on Replit.
  const API = '';

  if (error) {
    showError(error === 'access_denied' ? 'Access was denied' : error);
    return;
  }
  if (!code) {
    showError('No authorization code received');
    return;
  }

  try {
    const resp = await fetch(API + '/api/auth/google/exchange', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ code: code })
    });
    const data = await resp.json();
    if (resp.ok && data.success) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = 'Signed In!';
      document.getElementById('msg').textContent = 'Redirecting to dashboard...';
      setTimeout(function() { window.location.href = '/'; }, 800);
    } else {
      showError(data.error || 'Login failed');
    }
  } catch (e) {
    showError(e.message || 'Login failed');
  }

  function showError(message) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('title').textContent = 'Sign In Failed';
    document.getElementById('title').classList.add('error');
    document.getElementById('msg').innerHTML = message + '<br><br><a href="/">Back to Home</a>';
  }
})();
</script>
</body>
</html>
