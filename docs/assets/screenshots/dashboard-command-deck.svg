<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24201c"/>
      <stop offset="100%" stop-color="#1a1714"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="620" rx="16" fill="url(#bg)" stroke="#332c24" stroke-width="2"/>

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1000" height="64" fill="#1c1814" border-bottom="1px solid #332c24"/>
  <circle cx="44" cy="32" r="16" fill="url(#amber)"/>
  <text x="44" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">OS</text>
  <text x="74" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="17" font-weight="bold" fill="#f5f5f4">Household OS</text>
  <rect x="200" y="22" width="70" height="22" rx="11" fill="#332c24"/>
  <text x="235" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">v1.0.0 PROD</text>

  <!-- Status pills on right -->
  <rect x="740" y="20" width="110" height="26" rx="13" fill="#102e20" stroke="#059669" stroke-width="1"/>
  <circle cx="754" cy="33" r="4" fill="#34d399"/>
  <text x="766" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" fill="#34d399">15 Online</text>

  <rect x="860" y="20" width="100" height="26" rx="13" fill="#24201c" stroke="#443c32" stroke-width="1"/>
  <text x="910" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="500" fill="#d6d3d1" text-anchor="middle">72°F Sunny</text>

  <!-- Grid of Cards -->

  <!-- Card 1: Executive Climate & Crestron Scenes -->
  <g transform="translate(30, 85)">
    <rect width="300" height="240" rx="12" fill="url(#card-grad)" stroke="#332c24"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="bold" fill="#f5f5f4">Climate &amp; Crestron Lighting</text>
    <text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#a8a29e">Main Residence &amp; Guest Wing</text>

    <!-- Dial Graphic -->
    <circle cx="85" cy="130" r="50" fill="none" stroke="#332c24" stroke-width="10"/>
    <path d="M 50 165 A 50 50 0 1 1 120 165" fill="none" stroke="url(#amber)" stroke-width="10" stroke-linecap="round"/>
    <text x="85" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="24" font-weight="bold" fill="#f5f5f4" text-anchor="middle">71°</text>
    <text x="85" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#a8a29e" text-anchor="middle">HEATING SET 72°</text>

    <!-- Preset scene buttons -->
    <rect x="160" y="80" width="120" height="32" rx="6" fill="#332c24" stroke="url(#amber)" stroke-width="1"/>
    <text x="220" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">Evening Entertaining</text>

    <rect x="160" y="120" width="120" height="32" rx="6" fill="#24201c" stroke="#332c24"/>
    <text x="220" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="500" fill="#d6d3d1" text-anchor="middle">Late Night Soft</text>

    <rect x="160" y="160" width="120" height="32" rx="6" fill="#24201c" stroke="#332c24"/>
    <text x="220" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="500" fill="#d6d3d1" text-anchor="middle">All Off / Away</text>

    <!-- Footer stats -->
    <line x1="20" y1="205" x2="280" y2="205" stroke="#2c2722"/>
    <text x="20" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#a8a29e">Radiant Floor: <tspan fill="#34d399">Active (74°)</tspan></text>
    <text x="170" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#a8a29e">Fireplace: <tspan fill="#fbbf24">Timer 45m</tspan></text>
  </g>

  <!-- Card 2: Tesla EV Fleet -->
  <g transform="translate(350, 85)">
    <rect width="300" height="240" rx="12" fill="url(#card-grad)" stroke="#332c24"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="bold" fill="#f5f5f4">Tesla Fleet Operations</text>
    <text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#a8a29e">Fleet API • Ready at Home</text>

    <!-- Vehicle 1: Model X -->
    <rect x="20" y="70" width="260" height="65" rx="8" fill="#1f1b17" stroke="#332c24"/>
    <text x="35" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold" fill="#f5f5f4">Model X Plaid</text>
    <text x="35" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#a8a29e">Locked • Plugged In</text>
    <rect x="205" y="85" width="60" height="22" rx="4" fill="#0f2b1d"/>
    <text x="235" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">88% 284m</text>

    <!-- Vehicle 2: Cybertruck -->
    <rect x="20" y="145" width="260" height="65" rx="8" fill="#1f1b17" stroke="#332c24"/>
    <text x="35" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold" fill="#f5f5f4">Cybertruck Foundation</text>
    <text x="35" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#a8a29e">Climate 70° • In Garage</text>
    <rect x="205" y="160" width="60" height="22" rx="4" fill="#0f2b1d"/>
    <text x="235" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">76% 242m</text>
  </g>

  <!-- Card 3: Pool & Spa Hydrology -->
  <g transform="translate(670, 85)">
    <rect width="300" height="240" rx="12" fill="url(#card-grad)" stroke="#332c24"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="bold" fill="#f5f5f4">Pool &amp; Spa Hydrology</text>
    <text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#a8a29e">Zodiac / iAquaLink Telemetry</text>

    <!-- Spa Ready Pill -->
    <rect x="20" y="70" width="125" height="50" rx="8" fill="#1c2538" stroke="#2563eb" stroke-width="1"/>
    <text x="32" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600" fill="#93c5fd">SPA TEMP</text>
    <text x="32" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="20" font-weight="bold" fill="#60a5fa">102°F</text>

    <rect x="155" y="70" width="125" height="50" rx="8" fill="#1f1b17" stroke="#332c24"/>
    <text x="167" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600" fill="#a8a29e">POOL TEMP</text>
    <text x="167" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="20" font-weight="bold" fill="#f5f5f4">84°F</text>

    <!-- Action button -->
    <rect x="20" y="135" width="260" height="34" rx="8" fill="url(#blue)"/>
    <text x="150" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Spa Mode Active (Heater ON)</text>

    <!-- Filter & Light sub-row -->
    <line x1="20" y1="185" x2="280" y2="185" stroke="#2c2722"/>
    <text x="20" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#a8a29e">Pump: <tspan fill="#34d399">High Speed (2800 RPM)</tspan></text>
    <text x="20" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#a8a29e">Water Feature: <tspan fill="#60a5fa">Sheer Descent ON</tspan></text>
  </g>

  <!-- Lower Row: Energy Telemetry & Security -->
  <g transform="translate(30, 345)">
    <!-- Card 4: Electrical & Backup Generator -->
    <rect width="460" height="240" rx="12" fill="url(#card-grad)" stroke="#332c24"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="bold" fill="#f5f5f4">Energy &amp; Standby Backup Power</text>
    <text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#a8a29e">Generac Standby • Emporia Vue 16-Channel CTs</text>

    <!-- Main Grid load -->
    <rect x="20" y="70" width="130" height="60" rx="8" fill="#1f1b17" stroke="#332c24"/>
    <text x="32" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600" fill="#a8a29e">CURRENT DEMAND</text>
    <text x="32" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="22" font-weight="bold" fill="#fbbf24">8.4 kW</text>

    <rect x="165" y="70" width="130" height="60" rx="8" fill="#102e20" stroke="#059669" stroke-width="1"/>
    <text x="177" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600" fill="#34d399">GENERATOR STATUS</text>
    <text x="177" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="bold" fill="#34d399">Ready (Utility OK)</text>

    <rect x="310" y="70" width="130" height="60" rx="8" fill="#1f1b17" stroke="#332c24"/>
    <text x="322" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600" fill="#a8a29e">PROJECTED BILL</text>
    <text x="322" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="22" font-weight="bold" fill="#f5f5f4">$842</text>

    <!-- Circuit breakdown bars -->
    <text x="20" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" fill="#d6d3d1">Top Electrical Loads:</text>
    <text x="20" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#a8a29e">Main HVAC Chiller (3.2 kW)</text>
    <rect x="190" y="172" width="250" height="8" rx="4" fill="#332c24"/>
    <rect x="190" y="172" width="180" height="8" rx="4" fill="url(#amber)"/>

    <text x="20" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#a8a29e">Tesla Wall Connector (3.8 kW)</text>
    <rect x="190" y="197" width="250" height="8" rx="4" fill="#332c24"/>
    <rect x="190" y="197" width="210" height="8" rx="4" fill="url(#green)"/>

    <text x="20" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#a8a29e">Pool Main VSP (1.4 kW)</text>
    <rect x="190" y="220" width="250" height="8" rx="4" fill="#332c24"/>
    <rect x="190" y="220" width="90" height="8" rx="4" fill="url(#blue)"/>
  </g>

  <!-- Card 5: Estate Perimeter & Security -->
  <g transform="translate(510, 345)">
    <rect width="460" height="240" rx="12" fill="url(#card-grad)" stroke="#332c24"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="bold" fill="#f5f5f4">Estate Security &amp; Activity</text>
    <text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#a8a29e">Verkada AI Cameras • Perimeter Gates • Yale Assure Locks</text>

    <!-- Gate / Door status boxes -->
    <rect x="20" y="70" width="130" height="60" rx="8" fill="#1f1b17" stroke="#332c24"/>
    <text x="32" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600" fill="#a8a29e">FRONT MOTOR GATE</text>
    <text x="32" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="bold" fill="#34d399">Closed &amp; Locked</text>

    <rect x="165" y="70" width="130" height="60" rx="8" fill="#1f1b17" stroke="#332c24"/>
    <text x="177" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600" fill="#a8a29e">DOOR LOCKS (8)</text>
    <text x="177" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="bold" fill="#34d399">All Secured</text>

    <rect x="310" y="70" width="130" height="60" rx="8" fill="#1f1b17" stroke="#332c24"/>
    <text x="322" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600" fill="#a8a29e">ALARM STATUS</text>
    <text x="322" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="bold" fill="#fbbf24">Armed (Home)</text>

    <!-- Recent Sightings / Activity timeline -->
    <text x="20" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" fill="#d6d3d1">Recent AI Sightings (Perimeter Cameras):</text>
    
    <circle cx="26" cy="180" r="4" fill="#34d399"/>
    <text x="38" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#f5f5f4">UPS Delivery Vehicle detected at Driveway Gate <tspan fill="#a8a29e">— 12:44 PM</tspan></text>

    <circle cx="26" cy="205" r="4" fill="#60a5fa"/>
    <text x="38" y="209" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#f5f5f4">Landscape service completed Rear Lawn Irrigation run <tspan fill="#a8a29e">— 11:15 AM</tspan></text>

    <circle cx="26" cy="228" r="4" fill="#a8a29e"/>
    <text x="38" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#f5f5f4">Cybertruck arrived from Beverly Hills <tspan fill="#a8a29e">— 09:20 AM</tspan></text>
  </g>
</svg>
