<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="map-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192419"/>
      <stop offset="100%" stop-color="#101910"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="620" rx="16" fill="url(#bg)" stroke="#332c24" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="18" font-weight="bold" fill="#f5f5f4">Interactive Estate Topology &amp; Smart Irrigation</text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" fill="#a8a29e">Rain Bird ESP-TM2 • 12 Active Hydrology Zones • Weather Intelligence Skip</text>

  <!-- Status pill -->
  <rect x="790" y="32" width="170" height="30" rx="15" fill="#1c2c3e" stroke="#0284c7" stroke-width="1"/>
  <circle cx="806" cy="47" r="5" fill="#38bdf8"/>
  <text x="818" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="600" fill="#38bdf8">Rain Skip: Active (60% rain)</text>

  <!-- Main Map Container -->
  <g transform="translate(40, 95)">
    <!-- Estate Grounds Canvas -->
    <rect width="640" height="480" rx="12" fill="url(#map-bg)" stroke="#233823" stroke-width="1.5"/>

    <!-- Property Boundary -->
    <polygon points="40,40 590,40 600,440 30,430" fill="none" stroke="#3d633d" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- Main Residence Footprint -->
    <rect x="180" y="140" width="280" height="180" rx="6" fill="#24201c" stroke="#443c32" stroke-width="2"/>
    <text x="320" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="bold" fill="#d6d3d1" text-anchor="middle">MAIN RESIDENCE</text>

    <!-- Swimming Pool -->
    <rect x="230" y="340" width="180" height="70" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="2"/>
    <text x="320" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" font-weight="bold" fill="#7dd3fc" text-anchor="middle">RESORT POOL &amp; SPA (102°)</text>

    <!-- Guest House / Pavilion -->
    <rect x="70" y="100" width="80" height="90" rx="4" fill="#221e1a" stroke="#3d362e"/>
    <text x="110" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#a8a29e" text-anchor="middle">CABANA</text>

    <!-- Irrigation Zone 1: Front Lawn (Active Water Feature) -->
    <g transform="translate(320, 80)">
      <circle cx="0" cy="0" r="16" fill="url(#water)" filter="drop-shadow(0 0 8px rgba(56,189,248,0.6))"/>
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Z1</text>
      <rect x="22" y="-12" width="130" height="24" rx="4" fill="#0f172a" stroke="#0284c7"/>
      <text x="30" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" font-weight="600" fill="#7dd3fc">Front Lawn: RUNNING (8m)</text>
    </g>

    <!-- Zone 2: North Rose Garden -->
    <g transform="translate(500, 100)">
      <circle cx="0" cy="0" r="14" fill="#2c2722" stroke="#443c32" stroke-width="2"/>
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="bold" fill="#d6d3d1" text-anchor="middle">Z2</text>
      <text x="18" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#a8a29e">Rose Garden (Idle)</text>
    </g>

    <!-- Zone 3: West Citrus Grove -->
    <g transform="translate(100, 270)">
      <circle cx="0" cy="0" r="14" fill="#2c2722" stroke="#443c32" stroke-width="2"/>
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="bold" fill="#d6d3d1" text-anchor="middle">Z3</text>
      <text x="18" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#a8a29e">Citrus Grove (Idle)</text>
    </g>

    <!-- Zone 4: Rear Putting Green & Lawn -->
    <g transform="translate(480, 360)">
      <circle cx="0" cy="0" r="14" fill="#2c2722" stroke="#443c32" stroke-width="2"/>
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="9" font-weight="bold" fill="#d6d3d1" text-anchor="middle">Z4</text>
      <text x="18" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#a8a29e">Putting Green (Next 5am)</text>
    </g>
  </g>

  <!-- Right: Zone Controls Panel -->
  <g transform="translate(710, 95)">
    <rect width="250" height="480" rx="12" fill="#1c1814" stroke="#332c24"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="14" font-weight="bold" fill="#f5f5f4">Zone Quick Actions</text>
    <text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#a8a29e">One-Tap Manual Override</text>

    <!-- Button 1 -->
    <rect x="20" y="75" width="210" height="46" rx="8" fill="#102e20" stroke="#059669"/>
    <text x="35" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="bold" fill="#34d399">Zone 1: Front Lawn</text>
    <text x="35" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#a8a29e">Click to Stop Watering</text>

    <!-- Button 2 -->
    <rect x="20" y="130" width="210" height="46" rx="8" fill="#24201c" stroke="#332c24"/>
    <text x="35" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="bold" fill="#f5f5f4">Zone 2: Rose Garden</text>
    <text x="35" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#fbbf24">Run 15 min cycle →</text>

    <!-- Button 3 -->
    <rect x="20" y="185" width="210" height="46" rx="8" fill="#24201c" stroke="#332c24"/>
    <text x="35" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="bold" fill="#f5f5f4">Zone 3: Citrus Grove</text>
    <text x="35" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#fbbf24">Run 20 min cycle →</text>

    <!-- Button 4 -->
    <rect x="20" y="240" width="210" height="46" rx="8" fill="#24201c" stroke="#332c24"/>
    <text x="35" y="261" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="bold" fill="#f5f5f4">Zone 4: Putting Green</text>
    <text x="35" y="277" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10" fill="#fbbf24">Run 10 min cycle →</text>

    <!-- Master Button -->
    <rect x="20" y="415" width="210" height="44" rx="8" fill="#dc2626"/>
    <text x="125" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Emergency All Valves Stop</text>
  </g>
</svg>
