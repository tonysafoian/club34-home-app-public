name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [main]

env:
  BACKEND_URL: ${{ vars.BACKEND_URL || 'https://club34.replit.app' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22: @capacitor/cli requires >=22, and Node 20's bundled npm
          # 10.8.2 crashed mid-`npm ci` ("Exit handler never called!") while
          # still exiting 0, leaving node_modules incomplete — which made the
          # next step's `npx tsc` fetch the bogus `tsc` package and fail every
          # deploy since 2026-06-03.
          node-version: 22
          cache: npm

      - name: Normalize lockfile registry URLs (Replit package-firewall guard)
        # Installing packages inside Replit rewrites package-lock.json
        # `resolved` URLs to http://package-firewall.replit.local/..., a host
        # that only exists inside Replit. On GitHub runners npm hangs 60s per
        # tarball then dies ("Exit handler never called!") — this broke every
        # frontend deploy from 2026-06-03 to 2026-07-23. Swap back to the
        # public registry (integrity hashes are unchanged, so npm ci is safe).
        run: sed -i 's|http://package-firewall.replit.local/npm/|https://registry.npmjs.org/|g' package-lock.json

      - run: npm ci

      - name: Type check
        # --no-install: if node_modules is broken, fail loudly here instead of
        # downloading the fake `tsc` package from the registry.
        run: npx --no-install tsc --noEmit -p tsconfig.app.json

      - run: npm run build:frontend
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ env.BACKEND_URL }}

      - name: Generate CF Pages config from templates
        run: |
          BACKEND_WSS=$(echo "$BACKEND_URL" | sed 's|^https://|wss://|')
          sed -e "s|__BACKEND_URL__|$BACKEND_URL|g" public/_redirects.template > dist/public/_redirects
          sed -e "s|__BACKEND_URL__|$BACKEND_URL|g" -e "s|__BACKEND_WSS__|$BACKEND_WSS|g" public/_headers.template > dist/public/_headers

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/public --project-name=club34

      - name: Verify deployed chunks resolve
        env:
          BASE_URL: ${{ vars.FRONTEND_URL || 'http://localhost:5000' }}
        run: node scripts/check-deploy-chunks.mjs "$BASE_URL"
